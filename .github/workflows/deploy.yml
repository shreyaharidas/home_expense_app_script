name: Deploy Apps Script

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Restore .clasp.json
        env:
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASP_JSON"
          printf "%s" "$CLASP_JSON" > .clasp.json

      - name: Build Apps Script bundle
        run: npm run build

      - name: Configure clasp build directory
        run: |
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const config = JSON.parse(await readFile(".clasp.json", "utf8"));
            config.rootDir = "dist";
            await writeFile(".clasp.json", `${JSON.stringify(config, null, 2)}\n`);
          '

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf "%s" "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Verify clasp authentication
        run: npx --no-install clasp login --status

      - name: Verify Apps Script project
        run: npx --no-install clasp status

      - name: Push latest code to Apps Script
        run: npx --no-install clasp push --force

      - name: Success
        run: echo "✅ Latest code pushed successfully to the bound Apps Script project."
